spring.application.name=backend
spring.profiles.active=local

# ===============================
# DATABASE CONFIG (Env vars with local fallbacks)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pricetracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# JWT CONFIG
# ===============================
jwt.secret=${JWT_SECRET:PriceTrackerSecretKeyPriceTrackerSecretKeyDefaultPlaceholderValue}
jwt.expiration=86400000

# ===============================
# SCRAPER CONFIG
# ===============================
app.scraper.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
app.scraper.timeout=10000

# ===============================
# EMAIL CONFIG
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:placeholder@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:placeholder_app_password}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# VAPID CONFIG (For Web Push)
# ===============================
# If left blank, the server will automatically generate a secure VAPID keypair on startup!
vapid.public.key=${VAPID_PUBLIC_KEY:}
vapid.private.key=${VAPID_PRIVATE_KEY:}
vapid.subject=${VAPID_SUBJECT:mailto:placeholder@gmail.com}